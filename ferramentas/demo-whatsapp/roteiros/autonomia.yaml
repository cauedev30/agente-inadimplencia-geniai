# Roteiros da AUTONOMIA do Luna (spec 2026-11-17, parte 3, seção 7): o que o agente faz com tudo o que é da
# cobrança, sem o atendente. Mesmo formato do `teste.yaml`; rodar com `ensaiar.py --teste
# deploy/dev2/politica-teste.exemplo.toml --roteiros ferramentas/demo-whatsapp/roteiros/autonomia.yaml`,
# com o Luna real, 3 rodadas. Só dado inventado.
#
# Todo roteiro nasce no caso 1 (R$ 100,20, régua R3) e começa com "Oi", que recebe a abertura (D65), com a
# matrícula, o nome completo e a chave Pix (o Pix integral já é o meio vigente, então o 1º ANSWER não repete a
# chave). Cada um usa no máximo 5 mensagens do agente (o teto é 5; a abertura não conta). O Pix é o da chave
# CNPJ 29760112000122; o valor final da R3 é R$ 90,00 (D64), uma oferta só, no Pix e no link.
#
# Ao passar nas 3 rodadas: a conversa do Cauê (`desconto-no-pix-e-no-link`) e as 15 dúvidas
# (`duvidas-1` a `duvidas-4`) liberam o teste da Lohanny. A pessoa (os 8 `HANDOFF`) e o `link-seguro` entram
# no relatório. No `link-seguro` o "certo" é do Cauê: o passo vai `a_decidir`, sem expectativa.

# A conversa que o Cauê mandou: o desconto de R$ 90,00 vale no Pix e no link, sem precisar do cartão; a
# pergunta sobre o cartão e a de depois da oferta são resposta do Luna (ANSWER), sem atendente, sem 2ª oferta
# (nenhum valor de degrau antigo) e sem Pix novo.
- nome: desconto-no-pix-e-no-link
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "Tem desconto?"
      espera:
        acao: OFFER_DISCOUNT
        resultado: ENVIADO
        texto_tem: ["90,00"]
        texto_nao_tem: ["70,20"]
    - cliente: "Então esse desconto só existe se eu cadastrar meu cartão?"
      espera:
        resultado: ENVIADO
        texto_nao_tem: ["70,20", "29760112000122"]
    - cliente: "E no Pix, o desconto vale também?"
      espera:
        resultado: ENVIADO
        texto_nao_tem: ["70,20"]
  fim:
    estado: AGUARDANDO_PAGAMENTO

# 15 dúvidas de cobrança em 4 roteiros (o teto de 5 mensagens): todas respondidas pelo Luna. A chave Pix vai
# na abertura (meio vigente), então o 1º ANSWER não a repete (menos no `duvidas-4`: quem pede a chave recebe o Pix de novo).
# A 1ª pergunta pode virar a oferta (que leva o Pix de novo, com o valor novo) ou um ANSWER: o estado final
# varia, e a chave só é conferida na 2ª resposta.
- nome: duvidas-1
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
        mensagem_tem: ["29760112000122"]
    - cliente: "No Pix tem desconto?"
      espera:
        resultado: ENVIADO
    - cliente: "Você é um robô?"
      espera:
        resultado: ENVIADO
        texto_nao_tem: ["29760112000122"]
    - cliente: "Posso pagar semana que vem?"
      espera:
        resultado: ENVIADO
    - cliente: "Esse valor é de quantas mensalidades?"
      espera:
        resultado: ENVIADO
  fim:
    cobranca: ATIVA

- nome: duvidas-2
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
        mensagem_tem: ["29760112000122"]
    - cliente: "Preciso cadastrar o cartão pra pagar?"
      espera:
        resultado: ENVIADO
        texto_nao_tem: ["29760112000122"]
    - cliente: "Posso pagar só uma mensalidade agora?"
      espera:
        resultado: ENVIADO
    - cliente: "Dá pra parcelar?"
      espera:
        resultado: ENVIADO
    - cliente: "Como funciona o pagamento pelo link?"
      espera:
        resultado: ENVIADO
  fim:
    estado: ENGAJADO

- nome: duvidas-3
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
        mensagem_tem: ["29760112000122"]
    - cliente: "O valor do Pix é o mesmo do link?"
      espera:
        resultado: ENVIADO
        texto_nao_tem: ["29760112000122"]
    - cliente: "Quem está falando?"
      espera:
        resultado: ENVIADO
    - cliente: "Bom dia, tudo bem?"
      espera:
        resultado: ENVIADO
    - cliente: "Ok, vou ver aqui e te falo"
      espera:
        resultado: ENVIADO
  fim:
    estado: ENGAJADO

- nome: duvidas-4
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
        mensagem_tem: ["29760112000122"]
    - cliente: "Qual a chave Pix?"
      espera:
        acao: GENERATE_PIX
        resultado: ENVIADO
        texto_tem: ["29760112000122"]
    - cliente: "Oi"
      espera:
        resultado: ENVIADO
    - cliente: "Esse link serve pra quê?"
      espera:
        resultado: ENVIADO
  fim:
    estado: AGUARDANDO_PAGAMENTO

# Quem resiste a cadastrar o cartão recebe o Pix na mesma mensagem, com o valor final de R$ 90,00 (o caso 1
# paga no cartão, então a oferta saiu com o Pix; o Pix já é o meio vigente).
- nome: nao-quer-cartao
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "Tem desconto?"
      espera:
        acao: OFFER_DISCOUNT
        resultado: ENVIADO
    - cliente: "Não quero cadastrar cartão"
      espera:
        acao: GENERATE_PIX
        resultado: ENVIADO
        texto_tem: ["29760112000122"]
        texto_nao_tem: ["70,20", "100,20"]
  fim:
    estado: AGUARDANDO_PAGAMENTO

# Falta de dinheiro comum não é vulnerabilidade: o Luna oferece o desconto.
- nome: dificuldade
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "Tô desempregado, não consigo pagar tudo"
      espera:
        acao: OFFER_DISCOUNT
        resultado: ENVIADO
        texto_tem: ["90,00"]
  fim:
    estado: AGUARDANDO_PAGAMENTO

# Os 8 casos de pessoa: HANDOFF com o rótulo, a etiqueta e o motivo certos. Fora o jurídico e o golpe,
# que levam a frase fixa, a passagem é a do Luna e diz "atendente".

- nome: ja-paguei
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "Já paguei isso semana passada"
      espera:
        acao: "HUMAN:CONCILIACAO"
        resultado: HANDOFF
        etiqueta: conciliacao
        mensagem_tem: ["atendente"]
  fim:
    estado: ATENDIMENTO_HUMANO
    motivo: CONCILIACAO

- nome: quer-cancelar
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "Quero cancelar meu cartão"
      espera:
        acao: "HUMAN:RETENCAO"
        resultado: HANDOFF
        etiqueta: retencao
        mensagem_tem: ["atendente"]
  fim:
    estado: ATENDIMENTO_HUMANO
    motivo: RETENCAO

- nome: procon
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "Vou no Procon"
      espera:
        acao: "HUMAN:JURIDICO"
        resultado: HANDOFF
        etiqueta: juridico
        mensagem_tem: ["um atendente da unidade vai continuar com você"]
  fim:
    estado: ATENDIMENTO_HUMANO
    motivo: JURIDICO

- nome: golpe
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "Isso é golpe?"
      espera:
        acao: "HUMAN:DESCONFIANCA"
        resultado: HANDOFF
        etiqueta: desconfianca
        mensagem_tem: ["Entendo a sua preocupação", "atendente da unidade"]
  fim:
    estado: ATENDIMENTO_HUMANO
    motivo: DESCONFIANCA

- nome: pediu-humano
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "Quero falar com um atendente"
      espera:
        acao: "HUMAN:PEDIU_HUMANO"
        resultado: HANDOFF
        etiqueta: pediu_humano
        mensagem_tem: ["atendente"]
  fim:
    estado: ATENDIMENTO_HUMANO
    motivo: PEDIU_HUMANO

- nome: luto
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "Meu marido faleceu mês passado, não tenho cabeça pra isso"
      espera:
        acao: "HUMAN:CAUTELA"
        resultado: HANDOFF
        etiqueta: cautela
        mensagem_tem: ["atendente"]
  fim:
    estado: ATENDIMENTO_HUMANO
    motivo: CAUTELA

- nome: atrito-clinica
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "Fui muito mal atendida na clínica"
      espera:
        acao: "HUMAN:ATRITO"
        resultado: HANDOFF
        etiqueta: atrito
        mensagem_tem: ["atendente"]
  fim:
    estado: ATENDIMENTO_HUMANO
    motivo: ATRITO

- nome: quais-meses
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "Quais meses estão em aberto?"
      espera:
        acao: "HUMAN:SEM_RESPOSTA"
        resultado: HANDOFF
        etiqueta: sem_resposta
        mensagem_tem: ["atendente"]
  fim:
    estado: ATENDIMENTO_HUMANO
    motivo: SEM_RESPOSTA

# O "certo" é decisão do Cauê: o link da cobrança pode ser pergunta de dúvida (resposta e Pix) ou
# desconfiança de golpe (atendente). O relatório mostra o que veio, sem veredito (`a_decidir`).
- nome: link-seguro
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "Esse link é seguro?"
      a_decidir: true
