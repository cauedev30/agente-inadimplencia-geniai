# Roteiros do ensaio do MODO TESTE (D56, D61): os 5 casos do cardapio-teste.toml, o Luna real e o
# Chatwoot falso. Rodar com `ensaiar.py --teste ferramentas/demo-whatsapp/politica-teste-ensaio.toml
# --roteiros ferramentas/demo-whatsapp/roteiros/teste.yaml`. Só dado inventado.
#
# Cada roteiro é um testador do piloto, com telefone inventado próprio, que nasce no caso 1 (o
# `caso_padrao`); os roteiros dos casos 2 a 5 começam com `/caso <n>`. O 1º "Oi" recebe a abertura
# com o valor do caso (as mensalidades x R$ 33,40: R$ 100,20, R$ 133,60, R$ 167,00 e R$ 200,40).
# "Pagar com Pix" é o toque no botão: o Pix fixo, sem o Luna, com o código `[TESTE]`. `/paguei`
# confirma o Pix; a confirmação do agente sai de uma rotina, depois do turno (`mensagem_tem` espera).
#
# `espera.acao` compara com `turno.acao_principal`; `texto_tem` olha o texto do agente no turno e
# `mensagem_tem` qualquer mensagem enviada ao Chatwoot na janela do passo (as do modo teste e as
# fixas não ficam no `texto_enviado`).

- nome: caso-1
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
        mensagem_tem: ["Oi, Ana", "100,20"]
    - cliente: "Quanto eu estou devendo?"
      espera:
        acao: INFORM_DEBT
        resultado: ENVIADO
        texto_tem: ["100,20"]
    - cliente: "Pagar com Pix"
      espera:
        acao: GENERATE_PIX
        resultado: ENVIADO
        texto_tem: ["100,20", "[TESTE]"]
    - cliente: "/paguei"
      espera:
        acao: "TESTE:PAGUEI"
        mensagem_tem: ["Simulando a confirmação do banco: Pix de R$ 100,20", "Recebemos o seu pagamento"]
  fim:
    cobranca: PAGA

