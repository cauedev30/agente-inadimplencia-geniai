# Dois dos 4 meses em aberto do caso 3 pagos por fora (boleto): a cobrança segue ativa com 2.
- nome: paguei-2-no-caso-3
  passos:
    - cliente: "/caso 3"
      espera:
        acao: "TESTE:CASO"
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "/paguei 2"
      espera:
        acao: "TESTE:PAGUEI"
        mensagem_tem: ["Simulando 2 mês(es) pago(s) por fora"]
  fim:
    cobranca: ATIVA
    mensalidades: 2

# Os comandos do testador: a lista de casos, a nota presa ao último turno, o comando desconhecido e o
# /reset, que recomeça o caso atual (a abertura volta no "Oi" seguinte). O "Oi" no meio da conversa
# não é cortesia: o agente volta a informar o débito. Fica aqui, e não num caso que termina PAGA,
# porque os comandos do teste rodam antes do turno e um handoff inesperado não os estraga.
- nome: comandos
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "Quanto eu estou devendo?"
      espera:
        acao: INFORM_DEBT
        resultado: ENVIADO
    - cliente: "Oi"
      espera:
        acao: INFORM_DEBT
        resultado: ENVIADO
    - cliente: "Quais meses estão em aberto?"
      espera:
        acao: "HUMAN:SEM_RESPOSTA"
        resultado: HANDOFF
    - cliente: "/nota o texto ficou claro"
      espera:
        acao: "TESTE:NOTA"
        mensagem_tem: ["Nota anotada"]
    - cliente: "/caso"
      espera:
        acao: "TESTE:CASO"
        mensagem_tem: ["Casos:", "Mande /caso <n>"]
    - cliente: "/qualquercoisa"
      espera:
        acao: "TESTE:DESCONHECIDO"
        mensagem_tem: ["Comando não reconhecido"]
    - cliente: "/reset"
      espera:
        acao: "TESTE:RESET"
        mensagem_tem: ["Agora você é o caso 1"]
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
        mensagem_tem: ["100,20"]

# "Já paguei" vai ao humano conferir (CONCILIACAO), sem Pix nem desconto.
- nome: ja-paguei
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "Já paguei isso semana passada"
      espera:
        acao: "HUMAN:CONCILIACAO"
        resultado: HANDOFF
  fim:
    estado: ATENDIMENTO_HUMANO
    motivo: CONCILIACAO

# AUD-07: uma foto sem texto (o comprovante) vai ao humano, sem o Luna.
- nome: foto-sem-texto
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - anexo: image
      espera:
        acao: "HUMAN:CONCILIACAO"
        resultado: HANDOFF
  fim:
    estado: ATENDIMENTO_HUMANO
    motivo: CONCILIACAO

# O teto (D33): 5 mensagens do agente (o toque no botão não passa pelo Luna e cada uma conta) e a 6ª é a
# fixa, que passa a conversa ao atendente.
- nome: teto
  passos:
    - cliente: "Oi"
      espera:
        acao: "TESTE:ABERTURA"
    - cliente: "Pagar com Pix"
      espera:
        acao: GENERATE_PIX
        resultado: ENVIADO
    - cliente: "Pagar com Pix"
      espera:
        acao: GENERATE_PIX
        resultado: ENVIADO
    - cliente: "Pagar com Pix"
      espera:
        acao: GENERATE_PIX
        resultado: ENVIADO
    - cliente: "Pagar com Pix"
      espera:
        acao: GENERATE_PIX
        resultado: ENVIADO
    - cliente: "Pagar com Pix"
      espera:
        acao: GENERATE_PIX
        resultado: ENVIADO
    - cliente: "Pagar com Pix"
      espera:
        acao: "FIXA:CANAL_EXTERNO"
        resultado: FIXA
        mensagem_tem: ["um atendente da unidade vai continuar com você"]
  fim:
    estado: ATENDIMENTO_HUMANO
    motivo: TETO
