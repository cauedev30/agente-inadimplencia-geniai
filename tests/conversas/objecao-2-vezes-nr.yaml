# Na régua sem desconto, a 1ª objeção recebe a explicação e a 2ª vai para o humano (G1.1).
nome: Objeção 2 vezes na NR
regua: NR
mensalidades: 1
propenso: false
turnos:
  - cliente: Tá caro, tem desconto?
    perguntas: {objecao_valor: true, acao: OFFER_DISCOUNT}
    esperado: {acao: INFORM_DEBT, anexos: [GENERATE_PIX]}
  - cliente: Sem desconto eu não pago.
    perguntas: {objecao_valor: true, acao: OFFER_DISCOUNT}
    esperado: {gatilho: OBJECAO_SEM_DESCONTO}
