[project]
name = "agente-inadimplencia"
version = "0.1.0"
description = "Agente de inadimplência da GeniAI para as franquias do Cartão de Todos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "tzdata>=2026.5",
    "httpx>=0.28.1",
    "fastapi>=0.160.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agente = "agente.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.23.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agente"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# O aviso pede o httpx2, que o FastAPI ainda não exige.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
